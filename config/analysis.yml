# Analysis settings shared by all notebooks. Each notebook reads this file with
# `config <- read_yaml(here("config", "analysis.yml"))`.

analysis:
  data_lock: "2026-09-05"
  horizon_days: 182

imputation:
  # Imputations for the three main analyses (overall survival, the six-month
  # QoL landmark, and TAOOH). Each imputation is created and fitted on its own
  # with a per-index seed, so raising m_main from 5 to 50 adds imputations
  # 6-50 and leaves 1-5 unchanged.
  m_main: 5
  # All other analyses use imputations 1-5 (SAP).
  m_supporting: 5
  maxit: 50
  donors: 5

posterior_draws:
  # Posterior draws per imputation used to compute estimands. Estimands are
  # recomputed from the saved fits on every render, so changing these only
  # changes the post-estimation, not the fits.
  main: 1000
  supporting: 1000

markov:
  chains: 4
  iterations: 1000
  warmup: 500
  # A Markov model that fails the diagnostic thresholds is refitted once with
  # this many iterations.
  retry_iterations: 2000

seeds:
  # Seed families. Per-imputation seeds are family + (imputation - 1) * 1000,
  # plus a fixed offset where one family is used for several steps.
  imputation: 17002
  qol: 17003
  taooh: 17004
  survival: 17005
  supporting: 17006
  diagnostics: 17007

diagnostics:
  max_rhat: 1.01
  min_ess_bulk: 400
  min_ess_tail: 400
  max_divergent_transitions: 0
  max_treedepth_exceeded: 0
  min_bfmi: 0.3
  # Posterior draws used by graphical model checks.
  posterior_draws: 200
