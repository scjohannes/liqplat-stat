# Sole ordered registry for the public analysis pipeline.  The runner never
# discovers QMDs from the directory tree: every executable stage is listed
# here, including pending contracts and the final report/SAP artifacts.
version: 1
stages:
  # Data validation, derivation, and QC
  - id: data_validate_inputs
    number: 10
    path: analysis/00-data/01-validate-inputs.qmd
    description: Validate locked private-domain schemas and availability
  - id: data_build_analysis_datasets
    number: 20
    path: analysis/00-data/02-build-analysis-datasets.qmd
    description: Build canonical analysis datasets
  - id: data_qc
    number: 30
    path: analysis/00-data/03-data-qc.qmd
    description: Run data-quality and derivation checks

  # Population
  - id: population_recruitment
    number: 40
    path: analysis/01-population/01-recruitment.qmd
    description: Recruitment and invitation accounting
  - id: population_consort
    number: 50
    path: analysis/01-population/02-consort.qmd
    description: CONSORT-style participant flow
  - id: population_baseline
    number: 60
    path: analysis/01-population/03-baseline-table.qmd
    description: Baseline cohort description

  # Main overall-survival analysis
  - id: primary_os_preparation
    number: 70
    path: analysis/02-primary/01-overall-survival/01-preparation.qmd
    description: Prepare locked OS endpoint and covariates
  - id: primary_os_imputation
    number: 80
    path: analysis/02-primary/01-overall-survival/02-imputation.qmd
    description: Main OS multiple imputation and convergence diagnostics
  - id: primary_os_fitting
    number: 90
    path: analysis/02-primary/01-overall-survival/03-fitting.qmd
    description: Fit primary OS proportional-hazards models
  - id: primary_os_estimand
    number: 100
    path: analysis/02-primary/01-overall-survival/04-estimand.qmd
    description: Calculate OS posterior estimands and RMST
  - id: primary_os_diagnostics
    number: 110
    path: analysis/02-primary/01-overall-survival/05-diagnostics.qmd
    description: Validate OS posterior diagnostics

  # Main quality-of-life analysis
  - id: primary_qol_analysis_decision
    number: 120
    path: analysis/02-primary/02-quality-of-life/00-analysis-decision.qmd
    description: Apply the prespecified OS RMST rule to select the QoL primary analysis
  - id: primary_qol_preparation
    number: 130
    path: analysis/02-primary/02-quality-of-life/01-preparation.qmd
    description: Prepare the adjusted death-inclusive six-month QoL endpoint
  - id: primary_qol_imputation
    number: 140
    path: analysis/02-primary/02-quality-of-life/02-imputation.qmd
    description: Impute the primary six-month QoL endpoint in 50 completed datasets
  - id: primary_qol_fitting
    number: 150
    path: analysis/02-primary/02-quality-of-life/03-fitting.qmd
    description: Fit primary adjusted death-inclusive proportional-odds models
  - id: primary_qol_estimand
    number: 160
    path: analysis/02-primary/02-quality-of-life/04-estimand.qmd
    description: Calculate QoL posterior estimands
  - id: primary_qol_diagnostics
    number: 170
    path: analysis/02-primary/02-quality-of-life/05-diagnostics.qmd
    description: Validate QoL posterior diagnostics
  - id: primary_qol_descriptive
    number: 172
    path: analysis/02-primary/02-quality-of-life/06-descriptive.qmd
    description: Save observed, imputed, and model-derived QoL distributions
  - id: primary_qol_proportional_odds_check
    number: 174
    path: analysis/02-primary/02-quality-of-life/07-proportional-odds-check.qmd
    description: Compare pooled common and threshold-specific QoL treatment odds ratios

