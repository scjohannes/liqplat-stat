name: consort_ipd
version: 1
description: Anonymous candidate-level CONSORT V4 flowchart accounting.
primary_key: []
exact_columns: true
privacy_boundary: No identifiers or linkage to clinical cohort; identical rows are valid candidates.
columns:
  screened: {type: integer, required: true, unit: binary, coding: "0 = not screened; 1 = screened", private: false}
  not_screened_reason: {type: string, required: true, nullable: true, unit: category, coding: "Competing trial; Three patients already selected for random invitation that week", private: false}
  exclusion_reason: {type: string, required: true, nullable: true, unit: category, coding: "No solid tumor; Primary brain tumor; Resectable tumor; No indication for medical treatment; Prior systemic treatment; GRC declined or unclear; Not eligible - reason not recorded", private: false}
  qualified_for_random_selection: {type: integer, required: true, unit: binary, coding: "0 = not qualified; 1 = qualified", private: false}
  group_assignment: {type: string, required: true, nullable: true, unit: category, coding: "ctDNA + SOC; SOC", private: false}
  invitation_status: {type: string, required: true, nullable: true, unit: category, coding: "Approached and accepted intervention; Approached and declined intervention; Not approached; Approached with decision missing", private: false}
  accepted_invitation: {type: integer, required: true, nullable: true, unit: binary, coding: "0 = declined; 1 = accepted; missing otherwise", private: false}
