name: recruitment
version: 1
description: Calendar recruitment export; one row per participant, without identifiers.
primary_key: []
exact_columns: true
privacy_boundary: Approved recruitment dates and assignment only; never join to patient records.
columns:
  informed_consent_date: {type: date, required: true, nullable: true, unit: date, coding: "consent date; missing when no consent recorded", private: false}
  randomization_date: {type: date, required: true, nullable: true, unit: date, coding: "randomization date; missing when not randomized", private: false}
  group_assignment: {type: integer, required: true, nullable: true, unit: binary, coding: "0 = external comparator; 1 = SAT invitation", private: false}
