name: Render SAP

# The analyses need the private data, so CI only checks that the Statistical
# Analysis Plan renders from a clean clone.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-sap:
    runs-on: windows-latest
    env:
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R 4.6.1
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Set up Quarto 1.9.37
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Install packages used by the SAP
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          extra-packages: any::knitr, any::rmarkdown, any::here, any::tidyverse, any::tinytable, any::arrow

      - name: Render SAP
        shell: pwsh
        run: quarto render sap/SAP.qmd --to typst --output-dir .ci-artifacts/sap
